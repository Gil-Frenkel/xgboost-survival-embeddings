[tool.poetry]
name = "xgbse"
version = "0.3.3"
description = "Improving XGBoost survival analysis with embeddings and debiased estimators"
authors = ["Loft Data Science Team <bandits@loft.com.br>"]
readme = "README.md"
packages = [{ include = "xgbse" }]
repository = "https://github.com/loft-br/xgboost-survival-embeddings"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
xgboost = { version = "^3.1.1", markers = "sys_platform == 'darwin'" }
xgboost-cpu = { version = "^3.1.1", markers = "sys_platform != 'darwin'" }
numpy = "^2.2.6"
scikit-learn = "^1.8.0"
pandas = "^2.3.0"
joblib = "^1.5.3"
lifelines = "^0.30.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.28"
mkdocstrings = { version = ">=0.18", extras = ["python-legacy"] }


[tool.poetry.group.dev.dependencies]
pre-commit = "^3.7.1"
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
ruff = "^0.5.0"

[tool.poetry.group.benchmark.dependencies]
pycox = "0.2.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
